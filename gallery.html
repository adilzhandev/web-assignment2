<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Adilzhan Kuandykov</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="">
  <header class="site-header">
    <a class="logo" href="index.html">Adilzhan Kuandykov</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Flexbox Cards</a>
      <a href="layout.html">Grid Layout</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="portfolio.html">Portfolio</a>
    </nav>
  </header>
  <main>
    <h1>My photo gallery</h1>
    <p>A collection of places, moments and hobbies. Select a photo to see it in full size.</p>
    <!-- Task 3: nine photos in equal-width Grid columns. -->
    <section class="gallery" aria-label="Photo gallery">
      <figure id="photo-1">
        <a href="images/photo-1.jpg" aria-label="Open photo: Glass sphere">
          <img src="images/photo-1.jpg" alt="A large glass sphere building beneath a cloudy sky" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Glass sphere</figcaption>
      </figure>
      <figure id="photo-2">
        <a href="images/photo-2.jpg" aria-label="Open photo: Medal">
          <img src="images/photo-2.jpg" alt="A hand holding a medal with an Astana emblem" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Medal</figcaption>
      </figure>
      <figure id="photo-3">
        <a href="images/photo-3.jpg" aria-label="Open photo: At the finish line">
          <img src="images/photo-3.jpg" alt="Adilzhan standing in front of a running event banner" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>At the finish line</figcaption>
      </figure>
      <figure id="photo-4">
        <a href="images/photo-4.jpg" aria-label="Open photo: Lake view">
          <img src="images/photo-4.jpg" alt="A person in an Astana IT University shirt overlooking a lake" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Lake view</figcaption>
      </figure>
      <figure id="photo-5">
        <a href="images/photo-5.jpg" aria-label="Open photo: Mountain view">
          <img src="images/photo-5.jpg" alt="A person raising their arms above a lake and mountains" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Mountain view</figcaption>
      </figure>
      <figure id="photo-6">
        <a href="images/photo-6.jpg" aria-label="Open photo: Chess">
          <img src="images/photo-6.jpg" alt="Black and white chess pieces" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Chess</figcaption>
      </figure>
      <figure id="photo-7">
        <a href="images/photo-7.jpg" aria-label="Open photo: Basketball">
          <img src="images/photo-7.jpg" alt="A basketball going through a hoop" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Basketball</figcaption>
      </figure>
      <figure id="photo-8">
        <a href="images/photo-8.jpg" aria-label="Open photo: Ekibastuz">
          <img src="images/photo-8.jpg" alt="An Ekibastuz roadside monument" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Ekibastuz</figcaption>
      </figure>
      <figure id="photo-9">
        <a href="images/photo-9.jpg" aria-label="Open photo: Gym">
          <img src="images/photo-9.jpg" alt="A person using a weight machine at the gym" loading="lazy">
          <span class="photo-overlay">Open photo</span>
        </a>
        <figcaption>Gym</figcaption>
      </figure>
    </section>
  </main>
  <footer class="site-footer">Adilzhan Kuandykov · SE-2526 · Assignment 2</footer>
</body>
</html>
